<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task.112.css">
</head>
<body>

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-5 col-lg-4">

            <div class="card shadow-sm p-4 border">

                <h1 class="logo text-center mb-4">Instagram</h1>
				<div style="text-align: center;">
				<img src="Instagram_icon.jpg" alt="instagram logo" width="180"></div>

                <form>

                    <div class="mb-3">
                        <input type="text" class="form-control"
                        placeholder="Phone number, username, or email">
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control"
                        placeholder="Password">
                    </div>

                    <div class="d-grid mb-3">
                        <button class="btn btn-primary">
                            Log In
                        </button>
                    </div>

                    <div class="text-center mb-3">
                        <span class="line">OR</span>
                    </div>

                    <div class="text-center mb-3">
                        <a href="#" class="facebook-login">
                            Log in with Facebook
                        </a>
                    </div>

                    <div class="text-center">
                        <a href="#">Forgot password?</a>
                    </div>

                </form>

            </div>

            <div class="card mt-3 p-3 text-center">
                Don't have an account?
                <a href="#">Sign up</a>
            </div>

        </div>

    </div>
</div>

</body>
</html>
